name: CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci.yml'
      - 'Dockerfile'
      - 'compose.yml'
      - 'docker-compose.override.yml'
      - 'go.mod'
      - 'go.sum'
      - '**.go'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'Dockerfile'
      - 'compose.yml'
      - 'docker-compose.override.yml'
      - 'go.mod'
      - 'go.sum'
      - '**.go'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build binary
        run: go build ./cmd/webguard-instance

      - name: Build production image
        if: github.event_name == 'pull_request'
        run: docker build --target production -t webguard-instance:test .
