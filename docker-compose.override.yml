services:
  webguard-instance:
    build:
      context: .
      target: development
    # Keep the development build local instead of inheriting the GHCR image name.
    image: webguard-instance:dev
    pull_policy: build
    command: ["go", "run", "./cmd/webguard-instance", "serve"]
    volumes:
      - ./:/app
    environment:
      - GO_ENV=development
      - PORT=${PORT:-8080}
